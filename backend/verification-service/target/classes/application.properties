# MongoDB connection (env only)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.connection-timeout=20000
spring.data.mongodb.socket-timeout=60000

# Redis connection (env only)
spring.data.redis.url=${REDIS_URL}

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
security.enabled=true

# Rate Limiting
spring.mvc.async.request-timeout=30000
server.tomcat.max-connections=10000
server.tomcat.threads.max=200

# Web3j config
web3j.client-address=${WEB3J_CLIENT_ADDRESS}
web3j.product-verifier-contract-address=${PRODUCT_VERIFIER_CONTRACT_ADDRESS}

# Kafka config
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.enabled=${KAFKA_ENABLED:false}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=*
management.health.mongo.enabled=false
management.health.redis.enabled=false
