# Explicit production profile; local profiles are not modified.
jwt.secret=${JWT_SECRET}
spring.datasource.url=jdbc:postgresql://db:5432/supplyprint
spring.datasource.username=supplyprint_app
spring.datasource.password=${DB_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.user=supplyprint_migration
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
blockchain.enabled=false
blockchain.rpc-url=http://127.0.0.1:9
blockchain.private-key=
blockchain.contract-address=
supplyprint.verify.require-blockchain=false
supplyprint.auth.allow-self-service-operator-roles=false
supplyprint.cookies.secure=true
supplyprint.cors.allowed-origins=${SUPPLYPRINT_CORS_ALLOWED_ORIGINS}
supplyprint.onnx.inter-op-threads=1
supplyprint.onnx.intra-op-threads=2
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,supplyprint
server.port=8080
server.address=0.0.0.0
server.shutdown=graceful
server.forward-headers-strategy=native
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=256
server.tomcat.accept-count=64
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.pool.size=1
logging.level.root=WARN
logging.level.com.supplychain=INFO
