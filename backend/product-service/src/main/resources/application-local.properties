# Local Development Profile - H2 In-Memory Database
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local

# H2 In-Memory Database (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:supplychain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-create schema
spring.jpa.hibernate.ddl-auto=create-drop

# H2 Console (optional - http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== PERFORMANCE TUNING ====================

# HikariCP Connection Pool - Optimized for high throughput
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=LocalHikariPool

# JPA/Hibernate Optimization
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Caffeine Cache - High Performance
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100000,expireAfterWrite=120s

# Tomcat Thread Pool - Maximize for local testing
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=500
server.tomcat.connection-timeout=5000

# Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=256

# Minimal Logging for Performance
logging.level.root=WARN
logging.level.com.supplychain=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.web=WARN

# Server Port
server.port=8080

# JWT Config (placeholder)
jwt.secret=localTestSecretKeyForDevelopmentOnly123456789
jwt.expiration=86400000
