# ── DEV profile: local PostgreSQL + deterministic embedding fallback ──────────
# Uses DevFallbackEmbeddingService (no ONNX model required in dev)
# Blockchain writes are disabled so no wallet/private key needed

spring.datasource.url=jdbc:postgresql://localhost:5433/supplyprint
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

blockchain.enabled=false

server.port=10000

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

logging.level.com.supplychain=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
