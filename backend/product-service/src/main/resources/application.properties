# ═══════════════════════════════════════════════════════════════
#  SupplyPrint – Product Service – Base Configuration
#  Override with environment variables or profile-specific files
# ═══════════════════════════════════════════════════════════════

spring.application.name=supplyprint-product-service

# ── Database ────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/supplyprint}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=SupplyPrint-HikariCP
spring.datasource.hikari.register-mbeans=true

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ── Flyway ──────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ─────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:changeme-at-least-256-bit-secret-key-here-yes}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=1209600000

# ── Blockchain ──────────────────────────────────────────────────
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:https://rpc-mumbai.maticvigil.com}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}

# ── ONNX ────────────────────────────────────────────────────────
supplyprint.onnx.inter-op-threads=1
supplyprint.onnx.intra-op-threads=2

# ── Verification threshold ──────────────────────────────────────
supplyprint.verify.similarity-threshold=0.85

# ── Outbox scheduler ────────────────────────────────────────────
supplyprint.outbox.interval-ms=10000

# ── OpenAPI / Swagger ───────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=supplyprint

# ── Spring Scheduling ───────────────────────────────────────────
spring.task.scheduling.pool.size=2

# ── Resilience4j ────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.blockchain-rpc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.blockchain-rpc.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.blockchain-rpc.sliding-window-size=10
resilience4j.circuitbreaker.instances.blockchain-rpc.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.blockchain-rpc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.blockchain-rpc.register-health-indicator=true

resilience4j.retry.instances.blockchain-rpc.max-attempts=3
resilience4j.retry.instances.blockchain-rpc.wait-duration=1s
resilience4j.retry.instances.blockchain-rpc.enable-exponential-backoff=true
resilience4j.retry.instances.blockchain-rpc.exponential-backoff-multiplier=2

# ── Web3j ───────────────────────────────────────────────────────
web3j.client-address=${BLOCKCHAIN_RPC_URL:https://rpc-mumbai.maticvigil.com}

# ── Server ──────────────────────────────────────────────────────
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json
server.tomcat.max-threads=200
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=16
server.tomcat.accept-count=200
server.tomcat.max-connections=10000
server.connection-timeout=5s

# ── Logging ─────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.supplychain=INFO
logging.level.org.hibernate.SQL=OFF
supplyprint.cors.allowed-origins=${SUPPLYPRINT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
supplyprint.rate-limit.requests-per-minute=${SUPPLYPRINT_RATE_LIMIT_RPM:120}
supplyprint.cookies.secure=${SUPPLYPRINT_COOKIES_SECURE:true}
supplyprint.auth.allow-self-service-operator-roles=${SUPPLYPRINT_ALLOW_SELF_SERVICE_OPERATOR_ROLES:false}
