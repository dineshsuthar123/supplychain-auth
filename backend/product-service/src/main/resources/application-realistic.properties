# =============================================================================
# REAL-WORLD PERFORMANCE PROFILE
# =============================================================================
# This profile exercises the FULL production stack:
#   PostgreSQL (real disk I/O) + Redis (real network) + Kafka (real async)
#
# Run:
#   SPRING_PROFILES_ACTIVE=realistic mvn spring-boot:run
#
# Prerequisites (docker-compose up -d postgresql redis kafka zookeeper):
#   - PostgreSQL on localhost:5432
#   - Redis      on localhost:6379
#   - Kafka      on localhost:9092
#
# Expected realistic metrics (single node, 16 GB RAM):
#   p50:  ~1 ms   (Redis cache hit)
#   p99:  ~20 ms  (DB miss + Redis write-back)
#   RPS:  3k-8k   (verifiable, no tricks)
# =============================================================================

# ==================== POSTGRESQL (real persistent database) ====================
spring.datasource.url=jdbc:postgresql://localhost:5433/supplychain?currentSchema=public&sslmode=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.hikari.data-source-properties.assumeMinServerVersion=15
spring.datasource.hikari.data-source-properties.stringtype=unspecified

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==================== HIKARICP ====================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=RealisticPool

# ==================== REDIS (distributed cache) ====================
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=${REDIS_PASSWORD:redispass}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5

# ==================== KAFKA (async audit events) ====================
spring.kafka.bootstrap-servers=localhost:9095
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.retries=1
spring.kafka.producer.properties.reconnect.backoff.ms=500
spring.kafka.producer.properties.reconnect.backoff.max.ms=5000

# ==================== CAFFEINE L0 CACHE (JVM-local) ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=50000,expireAfterWrite=60s

# ==================== RESILIENCE4J ====================
resilience4j.circuitbreaker.instances.redis-cache.sliding-window-size=20
resilience4j.circuitbreaker.instances.redis-cache.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis-cache.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redis-cache.permitted-number-of-calls-in-half-open-state=5

# Retry config for transient DB failures
resilience4j.retry.instances.db-write.max-attempts=3
resilience4j.retry.instances.db-write.wait-duration=200ms
resilience4j.retry.instances.db-write.enable-exponential-backoff=true
resilience4j.retry.instances.db-write.exponential-backoff-multiplier=2

# ==================== TOMCAT ====================
server.port=${PORT:10000}
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=200
server.http2.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json

# ==================== LOGGING ====================
logging.level.root=WARN
logging.level.com.supplychain=INFO
logging.level.io.github.resilience4j=INFO

# ==================== JWT (same as default) ====================
jwt.secret=${JWT_SECRET:supplychain-auth-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
