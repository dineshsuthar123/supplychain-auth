# Local Development Profile - H2 In-Memory Database
# Run with: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
# Performance Target: 100k+ req/min, <100ms P95

# H2 In-Memory Database (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:supplychain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-create schema
spring.jpa.hibernate.ddl-auto=create-drop

# H2 Console disabled for performance
spring.h2.console.enabled=false

# ==================== MAXIMUM PERFORMANCE TUNING ====================

# HikariCP Connection Pool - Maximum throughput
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=25
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.pool-name=UltraHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.leak-detection-threshold=0

# JPA/Hibernate - Maximum Speed
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Caffeine Cache - Maximum capacity
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200000,expireAfterWrite=300s,recordStats

# Tomcat Thread Pool - Ultra high concurrency
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=100
server.tomcat.max-connections=30000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=3000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=1000

# HTTP/2 for better multiplexing (if supported)
server.http2.enabled=true

# Response Compression - Aggressive
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=128

# Jackson JSON - Fastest serialization
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.default-property-inclusion=non_null

# Async Support
spring.mvc.async.request-timeout=30000

# Zero Logging for Maximum Performance
logging.level.root=ERROR
logging.level.com.supplychain=WARN
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework=ERROR
logging.level.org.apache.tomcat=ERROR

# Server Port
server.port=8080

# JWT Config
jwt.secret=localTestSecretKeyForDevelopmentOnly123456789
jwt.expiration=86400000
