# =============================================
# HIGH-PERFORMANCE CONFIGURATION
# Target: 12k+ req/min, <400ms latency
# =============================================

# Database - Optimized Connection Pool
spring.datasource.url=${POSTGRES_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariCP-SupplyChain

# JPA/Hibernate - Performance Tuned
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Caching - In-Memory for Ultra-Fast Reads
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# Web3j config
web3j.client-address=${WEB3J_CLIENT_ADDRESS:}
web3j.product-nft-contract-address=${PRODUCT_NFT_CONTRACT_ADDRESS:}

# JWT Authentication
jwt.secret=${JWT_SECRET:supplychain-auth-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# Swagger/OpenAPI - Disabled in prod for performance
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator - Minimal exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server - Optimized for throughput
server.port=${PORT:10000}
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Logging - Minimal for performance
logging.level.root=WARN
logging.level.com.supplychain=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.web=WARN
