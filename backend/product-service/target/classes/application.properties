# Production config (use env vars on Render)
spring.datasource.url=${POSTGRES_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Web3j config
web3j.client-address=${WEB3J_CLIENT_ADDRESS:}
web3j.product-nft-contract-address=${PRODUCT_NFT_CONTRACT_ADDRESS:}

# JWT Authentication
jwt.secret=${JWT_SECRET:supplychain-auth-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=*

# Server
server.port=${PORT:10000}
