# =============================================================================
# 🔥 TIER-4 GODLY PERFORMANCE CONFIGURATION 🔥
# =============================================================================
# Target Metrics:
# - RPS: 50,000 - 100,000+
# - p95 latency: ≤ 20ms
# - p99 latency: ≤ 30ms
# - p99.9 latency: ≤ 60ms
# - Success rate: 99.999%
# =============================================================================
# Run with: SPRING_PROFILES_ACTIVE=godmode mvn spring-boot:run

# ==================== DATABASE: H2 IN-MEMORY (Zero Latency) ====================
spring.datasource.url=jdbc:h2:mem:godmode;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;CACHE_SIZE=262144
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# ==================== HIKARICP: MAXIMUM THROUGHPUT ====================
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.pool-name=GodModePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=500
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=500
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# ==================== JPA/HIBERNATE: ZERO OVERHEAD ====================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=8192
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer=true

# ==================== CAFFEINE CACHE: MAXIMUM SIZE ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500000,expireAfterWrite=600s,recordStats

# ==================== TOMCAT: GODLY TUNING ====================
# Maximum threads - match your CPU cores * 100 for I/O bound
server.tomcat.threads.max=1000
server.tomcat.threads.min-spare=200
server.tomcat.max-connections=50000
server.tomcat.accept-count=5000
server.tomcat.connection-timeout=1000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000

# HTTP/2 for multiplexing
server.http2.enabled=true

# ==================== COMPRESSION: MINIMAL ====================
# Disable compression for minimum latency (CPU vs bandwidth tradeoff)
server.compression.enabled=false

# ==================== JACKSON JSON: FASTEST ====================
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.mapper.use-getters-as-setters=false

# ==================== ASYNC: MAXIMUM CONCURRENCY ====================
spring.mvc.async.request-timeout=60000

# ==================== LOGGING: COMPLETELY DISABLED ====================
logging.level.root=OFF
logging.level.com.supplychain=OFF
logging.level.org.hibernate=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.org.springframework=OFF
logging.level.org.apache.tomcat=OFF
logging.level.org.apache.catalina=OFF
logging.level.org.apache.coyote=OFF

# ==================== SERVER ====================
server.port=8080

# ==================== JWT ====================
jwt.secret=godModeSecretKeyForMaximumPerformance123456789
jwt.expiration=86400000

# ==================== SPRING BOOT OPTIMIZATIONS ====================
spring.main.lazy-initialization=false
spring.jmx.enabled=false
spring.main.banner-mode=off
