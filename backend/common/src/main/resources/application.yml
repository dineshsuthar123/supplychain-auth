spring:
  application:
    name: supplychain-common
  
  datasource:
    url: jdbc:postgresql://localhost:5432/supplychain
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms
  
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour
      cache-null-values: false

# Stripe Configuration
stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_replace_with_your_key}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_with_your_secret}
  price:
    starter: ${STRIPE_PRICE_STARTER:price_starter}
    professional: ${STRIPE_PRICE_PROFESSIONAL:price_professional}
    enterprise: ${STRIPE_PRICE_ENTERPRISE:price_enterprise}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProduction}
  expiration: 86400000 # 24 hours

# Application Configuration
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# Logging
logging:
  level:
    root: INFO
    com.supplychain: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
