name: Lotline CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: lotline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21.0.9
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B -ntp verify
        working-directory: backend
        env:
          DEBUG: "false"
      - run: docker build -t lotline-ci ./backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lotline-api
          path: backend/target/lotline-1.0.0.jar
  frontend-and-e2e:
    needs: backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: lotline
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: lotline
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U lotline -d lotline"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_PASSWORD: ci-database-only
      DEBUG: "false"
      SECURE_COOKIES: "false"
      TRUSTED_ORIGINS: http://localhost:5173,http://localhost:4173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21.0.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lotline-api
          path: artifacts
      - name: Generate isolated test credentials
        shell: python
        run: |
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ['JWT_SECRET', 'DEMO_PASSWORD']:
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value)
                  output.write(name + '=' + value + '\n')
      - run: python -m pip install -r scripts/requirements-checks.txt
      - run: python scripts/generate-api.py --check
      - run: python scripts/check-deployment.py --allow-unconfigured --official-schema
      - name: Start API after migrations
        run: |
          nohup java -jar artifacts/lotline-1.0.0.jar > artifacts/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/seed-demo.py --prefix lotline-demo --origin http://localhost:4173
      - run: npm run test:e2e
        working-directory: frontend
      - run: python scripts/smoke.py --origin http://localhost:4173 --output artifacts/smoke
      - run: python scripts/verify-evidence.py artifacts/smoke/lotline-evidence.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lotline-verification
          path: |
            artifacts/playwright-report
            artifacts/test-results
            docs/screenshots
          retention-days: 7
