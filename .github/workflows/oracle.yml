name: Oracle ARM64 validation
on:
  push:
    branches: [deploy/oracle-always-free]
  pull_request:
    paths: ["backend/product-service/**", "deploy/oracle/**", ".github/workflows/oracle.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oracle-arm64:
    # Standard native ARM runners are free for this PUBLIC repository. Never bill a private repo.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17.0.21
      - name: Verify native architecture and run production tests
        run: |
          test "$(uname -m)" = aarch64
          mvn -B -ntp -f backend/product-service/pom.xml verify
          python3 deploy/oracle/test_cost_guard.py
          python3 -O deploy/oracle/test_cost_guard.py
          python3 deploy/oracle/test_capacity_watch.py
          python3 -O deploy/oracle/test_capacity_watch.py
          for file in deploy/oracle/*.sh; do bash -n "$file"; done
      - name: Build production ARM64 image
        run: docker buildx build --platform linux/arm64 --load -t supplyprint-oracle:arm-validation -f deploy/oracle/Dockerfile .
      - name: Exercise actual HTTPS, image, persistence and restore paths
        run: python3 deploy/oracle/validate-local.py --start
      - name: Review real inference and persistent database under a shared 1-CPU budget
        run: python3 deploy/oracle/validate-local.py --start --small-resource-review --skip-rollback-test
      - name: Show bounded diagnostics
        if: failure()
        run: docker compose -p sp-oracle-check --env-file reports/oracle/local.env -f deploy/oracle/compose.yml logs --tail 50 api db proxy
