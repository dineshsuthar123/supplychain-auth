global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'supplyprint-product-service'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'product-service:8080'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: supplyprint-product-service

rule_files:
  - /etc/prometheus/rules/alerting-rules.yaml

