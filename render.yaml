# Temporary synthetic demo by default. See docs/deployment.md for owner-approved
# always-on / durable compute selections and backup recovery exercises.
services:
  - type: web
    name: lotline-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lotline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUSTED_ORIGINS
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_SSLMODE
        value: require
      - key: DEBUG
        value: "false"
databases:
  - name: lotline-db
    databaseName: lotline
    user: lotline_migration
    postgresMajorVersion: "17"
    plan: free
    region: singapore
    ipAllowList: []
