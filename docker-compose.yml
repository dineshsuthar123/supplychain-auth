services:
  # ─── PostgreSQL + pgvector ────────────────────────────────────────────────
  postgresql:
    image: pgvector/pgvector:pg15
    container_name: supplyprint-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplyprint}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - supplychain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-supplyprint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SupplyPrint product-service ─────────────────────────────────────────
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: supplyprint-product-service
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      # Production path: server-side ONNX inference only. The dev profile's
      # deterministic hash embedding is intentionally never enabled here.
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-supplyprint}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-https://rpc-mumbai.maticvigil.com}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-changeme-at-least-256-bit-secret-key-here-yes}
      SUPPLYPRINT_COOKIES_SECURE: "false"
      SUPPLYPRINT_ALLOW_SELF_SERVICE_OPERATOR_ROLES: "true"
      SUPPLYPRINT_RATE_LIMIT_REQUESTS_PER_MINUTE: ${SUPPLYPRINT_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - supplychain-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10000/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Observability ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: supplyprint-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - supplychain-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: supplyprint-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - supplychain-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  supplychain-network:
    driver: bridge
