name: supplyprint-oracle
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
x-security: &security
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging
  pids_limit: 256
services:
  db:
    <<: *security
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    platform: ${PLATFORM:-linux/arm64}
    environment:
      POSTGRES_DB: supplyprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Generate a private environment file}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-supplyprint.sh:ro
    networks: [database]
    shm_size: 128mb
    mem_limit: 768m
    cpus: 0.5
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "password_encryption=scram-sha-256", "-c", "log_min_duration_statement=1000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplyprint"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    <<: *security
    image: ${APP_IMAGE:?Set the immutable application image}
    platform: ${PLATFORM:-linux/arm64}
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Required}
      BLOCKCHAIN_ENABLED: "false"
      SUPPLYPRINT_CORS_ALLOWED_ORIGINS: ${TRUSTED_ORIGINS:?Set exact HTTPS origins}
    depends_on:
      db: { condition: service_healthy }
    networks:
      database: {}
      edge:
        aliases: [supplyprint-api]
    ports: ["127.0.0.1:${API_LOCAL_PORT:-18081}:8080"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.0
    stop_grace_period: 30s
  proxy:
    <<: *security
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    platform: ${PLATFORM:-linux/arm64}
    environment:
      API_HOST: ${API_HOST:?Set the public API hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 192m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
networks:
  database:
    internal: true
    name: ${DATABASE_NETWORK_NAME:-oracle-database}
  edge:
    name: ${EDGE_NETWORK_NAME:-oracle-edge}
volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
